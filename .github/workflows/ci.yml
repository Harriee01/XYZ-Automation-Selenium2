name: Selenium Tests CI

on:
  push:
    branches: [main, base, feature/pages, utils]
  pull_request:
    branches: [main,  base, feature/pages, utils]

jobs:
  selenium-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]

        # Expose outputs so the notify job can read them
    outputs:
      test_status: ${{ steps.set-status.outputs.status }}
      tests_total: ${{ steps.test-results.outputs.total }}
      tests_passed: ${{ steps.test-results.outputs.passed }}
      tests_failed: ${{ steps.test-results.outputs.failed }}
      tests_skipped: ${{ steps.test-results.outputs.skipped }}
      passed_tests: ${{ steps.parse-names.outputs.passed_names }}
      failed_tests: ${{ steps.parse-names.outputs.failed_names }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'eclipse-temurin'
          cache: maven

      - name: Run Maven Tests
        run: mvn clean test -Dheadless=true -B

      - name: Allure Report Generation
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_report: target/allure-report
          gh_pages: gh-pages
          allure_history: allure-history

      - name: Deploy Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

      - name: Archive Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/

      - name: Set job status output
        id: set-status
        run: |
            if [ "${{ steps.run-tests.outcome }}" = "success" ]; then
              echo "status=success" >> $GITHUB_OUTPUT
            else
              echo "status=failure" >> $GITHUB_OUTPUT
            fi
          
          

      - name: 📋 Parse Test Results
        if: always()
        id: test-results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
            files: target/surefire-reports/**/*.xml
            comment_mode: always    # post comment on PR with results
            check_name: "🧪 Selenium Test Results"

      - name: 🔎 Parse individual test names
        if: always()
        id: parse-names
        run: |
            PASSED=""
            FAILED=""
            
            for xml in target/surefire-reports/TEST-*.xml; do
              [ -f "$xml" ] || continue
            
              # Extract class name from filename: TEST-com.xyzbank.tests.ManagerTests.xml
              CLASS=$(basename "$xml" .xml | sed 's/^TEST-//')
            
              # Passed = testcase elements with NO failure/error child
              while IFS= read -r name; do
                PASSED="${PASSED}${CLASS}#${name}\n"
              done < <(
                xmllint --xpath \
                  "//testcase[not(failure) and not(error)]/@name" \
                  "$xml" 2>/dev/null \
                | grep -oP 'name="\K[^"]+'
              )
            
              # Failed = testcase elements WITH a failure/error child
              while IFS= read -r name; do
                FAILED="${FAILED}${CLASS}#${name}\n"
              done < <(
                xmllint --xpath \
                  "//testcase[failure or error]/@name" \
                  "$xml" 2>/dev/null \
                | grep -oP 'name="\K[^"]+'
              )
            done
            
            # Write to GITHUB_OUTPUT (multiline safe encoding)
            {
              echo "passed_names<<EOF"
              printf "%b" "$PASSED"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            
            {
              echo "failed_names<<EOF"
              printf "%b" "$FAILED"
              echo "EOF"
            } >> $GITHUB_OUTPUT

      #  Fail the job NOW if tests failed (after all reporting steps ran)
      - name: 🚦 Propagate test failure
        if: steps.run-tests.outcome == 'failure'
        run: exit 1
            

  notify:
        name: 📣 Slack Notification
        needs: selenium-test     # runs after Job 1 finishes
        if: always()               # runs even when selenium-tests job fails
        uses: ./.github/workflows/slack-notification.yml   # path to your reusable file
        with:
          status: ${{ needs.selenium-tests.outputs.test_status }}
          tests_total: ${{ needs.selenium-tests.outputs.tests_total }}
          tests_passed: ${{ needs.selenium-tests.outputs.tests_passed }}
          tests_failed: ${{ needs.selenium-tests.outputs.tests_failed }}
          tests_skipped: ${{ needs.selenium-tests.outputs.tests_skipped }}
          passed_tests: ${{ needs.selenium-tests.outputs.passed_tests }}
          failed_tests: ${{ needs.selenium-tests.outputs.failed_tests }}
        secrets:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}


