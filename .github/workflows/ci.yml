name: Selenium Tests CI

on:
  push:
    branches: [main, base, feature/pages, utils]
  pull_request:
    branches: [main,  base, feature/pages, utils]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'eclipse-temurin'
          cache: maven

      - name: Run Maven Tests
        run: mvn clean test -Dheadless=true -B

      - name: Allure Report Generation
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_report: target/allure-report
          gh_pages: gh-pages
          allure_history: allure-history

      - name: Deploy Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

      - name: Archive Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/

      - name: 📋 Parse Test Results
        if: always()
        id: test-results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
            files: target/surefire-reports/**/*.xml
            comment_mode: always    # post comment on PR with results
            check_name: "🧪 Selenium Test Results"

      - name: 📣 Notify Slack
        if: always()   # notify even on failure so team is alerted
        uses: slackapi/slack-github-action@v1.26.0
        with:
            payload: |
              {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *XYZ Bank Selenium* — Run #${{ github.run_number }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${{ job.status == 'success' && '✅ Tests Passed' || '❌ Tests FAILED' }} — XYZ Bank Selenium"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                      { "type": "mrkdwn", "text": "*Triggered by:*\n`${{ github.actor }}`" },
                      { "type": "mrkdwn", "text": "*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>" },
                      { "type": "mrkdwn", "text": "*Allure Report:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Download Artifact>" }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Tests:* ${{ steps.test-results.outputs.passed }} passed ✅ | ${{ steps.test-results.outputs.failed }} failed ❌ | ${{ steps.test-results.outputs.skipped }} skipped ⏭️"
                    }
                  }
                ]
              }
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
            SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: 📧 Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
           server_address: smtp.gmail.com
           server_port: 587
           secure: false           # STARTTLS on port 587
           username: ${{ secrets.EMAIL_USERNAME }}
           password: ${{ secrets.EMAIL_PASSWORD }}   # Gmail App Password (not account password)
           subject: |
              ${{ job.status == 'success' && '✅' || '❌' }} XYZ Bank Selenium — Run #${{ github.run_number }} (${{ github.ref_name }})
            to: ${{ secrets.EMAIL_TO }}
            from: XYZ Bank CI <${{ secrets.EMAIL_USERNAME }}>
            html_body: |
              <html>
              <body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
                <h2 style="color: ${{ job.status == 'success' && '#28a745' || '#dc3545' }};">
                  ${{ job.status == 'success' && '✅ Tests Passed' || '❌ Tests FAILED' }}
                </h2>
                <table style="border-collapse: collapse; width: 100%;">
                  <tr><td style="padding: 8px; border: 1px solid #ddd;"><b>Branch</b></td>
                      <td style="padding: 8px; border: 1px solid #ddd;">${{ github.ref_name }}</td></tr>
                  <tr><td style="padding: 8px; border: 1px solid #ddd;"><b>Triggered by</b></td>
                      <td style="padding: 8px; border: 1px solid #ddd;">${{ github.actor }}</td></tr>
                  <tr><td style="padding: 8px; border: 1px solid #ddd;"><b>Run Number</b></td>
                      <td style="padding: 8px; border: 1px solid #ddd;">#${{ github.run_number }}</td></tr>
                  <tr><td style="padding: 8px; border: 1px solid #ddd;"><b>Passed ✅</b></td>
                      <td style="padding: 8px; border: 1px solid #ddd;">${{ steps.test-results.outputs.passed }}</td></tr>
                  <tr><td style="padding: 8px; border: 1px solid #ddd;"><b>Failed ❌</b></td>
                      <td style="padding: 8px; border: 1px solid #ddd;">${{ steps.test-results.outputs.failed }}</td></tr>
                  <tr><td style="padding: 8px; border: 1px solid #ddd;"><b>Skipped ⏭️</b></td>
                      <td style="padding: 8px; border: 1px solid #ddd;">${{ steps.test-results.outputs.skipped }}</td></tr>
                </table>
                <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                  View Full Run on GitHub Actions →
                </a></p>
                <p style="color: #666; font-size: 12px;">
                  XYZ Bank Selenium CI | Powered by GitHub Actions + Allure
                </p>
              </body>
              </html>
